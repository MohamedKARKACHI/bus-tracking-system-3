# ========================================
# Bus Tracking System - Configuration
# ========================================

server:
  port: 4000
  
ai:
  service:
    url: http://localhost:8001

spring:
  application:
    name: bus-tracking-system

  # Database Configuration (H2 In-Memory)
  datasource:
    url: jdbc:h2:mem:bus_tracking_system;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
    
    # HikariCP settings (optional but good)
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  # Jackson Configuration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: UTC

# JWT Configuration
jwt:
  secret: bus-tracking-system-secret-key-2024-change-in-production-very-long-key
  expiration: 604800000  # 7 days in milliseconds

# CORS Configuration
cors:
  allowed-origins: http://localhost:3000
  allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
  allowed-headers: "*"

# Logging
logging:
  level:
    root: INFO
    com.bustracking: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
